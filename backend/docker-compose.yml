version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: vitrine
      POSTGRES_DB: vitrine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrine -d vitrine"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://vitrine:vitrine@db:5432/vitrine
      JWT_SECRET: troque-este-segredo-em-producao
      JWT_EXPIRE_MINUTES: 60
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8080"
      AUTH_REQUIRED: "false"
      UPLOAD_DIR: uploads
      PUBLIC_BASE_URL: http://localhost:8000
      ADMIN_EMAIL: admin@vitrine.local
      ADMIN_PASSWORD: changeme
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
