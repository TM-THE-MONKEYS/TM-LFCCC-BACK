# Secrets (JWT_SECRET, ADMIN_PASSWORD, DB password) come from env / .env only.
# Never bake credentials into the image.
#
# Migrations: run once via profile `migrate` BEFORE scaling `api` replicas.
#   docker compose --profile migrate run --rm migrate
#   docker compose up -d api
#
# Do not put `alembic upgrade` in the api CMD when running multiple replicas.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitrine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrine}
      POSTGRES_DB: ${POSTGRES_DB:-vitrine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Porta 5432 NÃO publicada no host — acesso só via rede interna do compose.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitrine} -d ${POSTGRES_DB:-vitrine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migrate job (profile: migrate). Avoids silent multi-replica race.
  migrate:
    profiles: ["migrate"]
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://vitrine:vitrine@db:5432/vitrine}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://vitrine:vitrine@db:5432/vitrine}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vitrine.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
    volumes:
      # Persistent product images across container recreates
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
