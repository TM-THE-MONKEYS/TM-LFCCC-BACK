[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine-backend"
version = "0.1.0"
description = "Backend FastAPI para a aplicação Vitrine (bazar beneficente LFCCC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",  # Multi-worker ASGI process manager (UvicornWorker) for production
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "PyJWT>=2.10.0",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.9",
    "httpx2>=0.28.0",
    "email-validator>=2.1.0",
    "tzdata>=2024.1",  # IANA TZ database for zoneinfo on Windows (APP_TIMEZONE)
    "Pillow>=10.0.0",  # Upload: re-encode images to strip payloads / verify content
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyJWT",
    "pip-audit>=2.7.0",  # CI dependency vulnerability scan
    "pre-commit>=3.7.0",  # Local git hooks (ruff)
]
test = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx2>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Strictness is raised gradually across hardening phases.
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
markers = [
    "postgres: requires PostgreSQL (skipped on SQLite test DB)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
