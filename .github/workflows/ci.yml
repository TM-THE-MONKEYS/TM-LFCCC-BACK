name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint · typecheck · unit (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest (SQLite) + coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: pip-audit
        run: pip-audit

  postgres:
    name: Postgres · migrate smoke · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitrine
          POSTGRES_PASSWORD: vitrine
          POSTGRES_DB: vitrine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitrine -d vitrine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://vitrine:vitrine@localhost:5432/vitrine_test
      JWT_SECRET: ci-test-secret-minimo-32-caracteres-ok
      ADMIN_PASSWORD: ci-admin-password-forte
      CORS_ORIGINS: http://localhost:5173
      CREATE_TABLES_ON_STARTUP: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Alembic check (models ↔ migrations)
        run: alembic check

      - name: Pytest against Postgres
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
